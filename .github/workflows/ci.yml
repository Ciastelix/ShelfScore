name: React CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npx nx lint shelf

    - name: Run tests
      run: npx nx test shelf --coverage

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./shelf/coverage/lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Build
      run: npx nx build shelf