name: React CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: ./shelf

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: shelf/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install

      - name: Lint
        run: pnpm nx lint shelf

      - name: Test (Vitest)
        run: pnpm vitest run

      - name: Typecheck
        run: pnpm tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: pnpm nx build shelf
