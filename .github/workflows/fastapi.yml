name: FastAPI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDM
        run: |
          python -m pip install --upgrade pip
          pip install pdm

      - name: Install dependencies
        run: pdm install

      - name: Run linting
        run: |
          pdm run flake8 src --exclude=alembic,migrations,alembic_models.py
          pdm run black --check src --exclude='alembic/.*|migrations/.*|alembic_models.py'

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pdm run pytest -q src/app/tests --cov=src --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}